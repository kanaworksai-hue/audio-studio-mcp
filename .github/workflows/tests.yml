name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    # Offline tests use a fake backend and stubbed runtimes, so they run without
    # MLX, PyTorch, a GPU or model weights.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install ffmpeg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg
          elif [ "$RUNNER_OS" = "Windows" ]; then choco install ffmpeg -y --no-progress
          else sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - run: uv sync
      - run: uv run pytest -v
