name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    # Offline tests use a fake backend and stubbed runtimes, so they run without
    # MLX, PyTorch, a GPU or model weights.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install ffmpeg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg
          elif [ "$RUNNER_OS" = "Windows" ]; then
            # the Chocolatey feed sometimes answers 406 and choco still exits 0: retry, then check
            for i in 1 2 3; do
              choco install ffmpeg -y --no-progress && command -v ffmpeg && break
              sleep 20
            done
          else sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          ffmpeg -version > /dev/null && echo "ffmpeg found: $(command -v ffmpeg)"
      - run: uv sync
      - run: uv run pytest -v
