[project]
name = "audio-studio-mcp"
version = "0.2.2"
description = "Local AI BGM and sound-effect generation (Stable Audio 3) as an MCP server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "東京AI映像合同会社" }]
requires-python = ">=3.10"
keywords = ["mcp", "stable-audio", "audio-generation", "sound-effects", "bgm", "mlx", "cuda"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "editables>=0.5",  # import hook of the editable install, see dev-mode-exact below
    "mcp>=2.3,<3",
    "numpy>=1.24",
    "pydantic>=2",
    "soundfile>=0.12",
]

[project.optional-dependencies]
# Stable Audio 3 on Apple Silicon (the official MLX runtime, cloned by install.sh).
mlx = [
    "mlx>=0.30; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sentencepiece>=0.2",
    "huggingface_hub>=0.20",
    "pillow>=10.0",
]
# Stable Audio 3 on Windows / Linux with an NVIDIA GPU (the official PyTorch
# runtime, cloned by install.ps1 / install.sh). Versions follow upstream's pins.
cuda = [
    "torch==2.7.1; sys_platform != 'darwin'",
    "torchaudio==2.7.1; sys_platform != 'darwin'",
    "einops>=0.8.2; sys_platform != 'darwin'",
    "einops-exts>=0.0.4; sys_platform != 'darwin'",
    "packaging>=24; sys_platform != 'darwin'",
    "safetensors>=0.7.0; sys_platform != 'darwin'",
    "tqdm>=4.67; sys_platform != 'darwin'",
    "huggingface-hub>=1.7.1; sys_platform != 'darwin'",
    "transformers>=5.8.0; sys_platform != 'darwin'",
]

[project.scripts]
audio-studio-mcp = "audio_studio_mcp.server:main"

[project.urls]
Homepage = "https://github.com/kanaworksai-hue/audio-studio-mcp"
Issues = "https://github.com/kanaworksai-hue/audio-studio-mcp/issues"

# CUDA 12.6 wheels of torch (upstream's default). macOS never installs them.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" }]
torchaudio = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" }]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_studio_mcp"]
# Editable installs (uv sync) load the package through an import hook (the
# `editables` dependency) instead of a .pth file holding the checkout's path:
# Python before 3.13 reads .pth files in the locale encoding, so on Windows a
# non-ASCII path (e.g. a Japanese user name) stops the venv's Python from starting.
dev-mode-exact = true

[tool.pytest.ini_options]
testpaths = ["tests"]
