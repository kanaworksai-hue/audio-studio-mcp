[project]
name = "audio-studio-mcp"
version = "1.1.1"
description = "Local AI BGM and sound-effect generation (Stable Audio 3) as an MCP server"
dynamic = ["readme"]  # README.md with absolute links for PyPI, see fancy-pypi-readme below
license = "MIT"
# The web UI ships a font (SIL OFL 1.1) and the Kana brand images, which are not
# MIT-licensed; their notices are in the package next to them.
license-files = [
    "LICENSE",
    "src/audio_studio_mcp/static/fonts/OFL.txt",
    "src/audio_studio_mcp/static/brand/README.md",
]
authors = [{ name = "東京AI映像合同会社" }]
requires-python = ">=3.10"
keywords = ["mcp", "stable-audio", "audio-generation", "sound-effects", "bgm", "mlx", "cuda"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "editables>=0.5",  # import hook of the editable install, see dev-mode-exact below
    "mcp>=2.3,<3",
    "numpy>=1.24",
    "pydantic>=2",
    "soundfile>=0.12",
    # The model runtime comes with the package on the two supported platforms,
    # so `uvx audio-studio-mcp` needs no extras (MCP registries can't pass them).
    # Apple Silicon: MLX (same as the mlx extra).
    "mlx>=0.30; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sentencepiece>=0.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "huggingface_hub>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pillow>=10.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # Windows: PyTorch (same as the cuda extra). PyPI only has CPU builds of
    # torch for Windows; uvx gets the CUDA build with --torch-backend cu126.
    "torch==2.7.1; sys_platform == 'win32'",
    "torchaudio==2.7.1; sys_platform == 'win32'",
    "einops>=0.8.2; sys_platform == 'win32'",
    "einops-exts>=0.0.4; sys_platform == 'win32'",
    "packaging>=24; sys_platform == 'win32'",
    "safetensors>=0.7.0; sys_platform == 'win32'",
    "tqdm>=4.67; sys_platform == 'win32'",
    "huggingface-hub>=1.7.1; sys_platform == 'win32'",
    "transformers>=5.8.0; sys_platform == 'win32'",
    # x86_64 Python on a Mac (Rosetta, e.g. an old Intel Homebrew): cryptography
    # 49+ (via mcp → pyjwt) has no x86_64 wheel and fails to build, so uvx would
    # stop before the server can say "use an arm64 Python". 48 is universal2.
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
# Stable Audio 3 on Apple Silicon (the official MLX runtime). Also in the base
# dependencies; kept for `uv sync --extra mlx` (install.sh) and older commands.
mlx = [
    "mlx>=0.30; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sentencepiece>=0.2",
    "huggingface_hub>=0.20",
    "pillow>=10.0",
]
# Stable Audio 3 on Windows / Linux with an NVIDIA GPU (the official PyTorch
# runtime). Versions follow upstream's pins. In the base dependencies on Windows;
# Linux needs this extra.
cuda = [
    "torch==2.7.1; sys_platform != 'darwin'",
    "torchaudio==2.7.1; sys_platform != 'darwin'",
    "einops>=0.8.2; sys_platform != 'darwin'",
    "einops-exts>=0.0.4; sys_platform != 'darwin'",
    "packaging>=24; sys_platform != 'darwin'",
    "safetensors>=0.7.0; sys_platform != 'darwin'",
    "tqdm>=4.67; sys_platform != 'darwin'",
    "huggingface-hub>=1.7.1; sys_platform != 'darwin'",
    "transformers>=5.8.0; sys_platform != 'darwin'",
]

[project.scripts]
audio-studio-mcp = "audio_studio_mcp.server:main"

[project.urls]
Homepage = "https://github.com/kanaworksai-hue/audio-studio-mcp"
Issues = "https://github.com/kanaworksai-hue/audio-studio-mcp/issues"

# CUDA 12.6 wheels of torch (upstream's default). macOS never installs them.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" }]
torchaudio = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" }]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=24"]
build-backend = "hatchling.build"

# PyPI shows README.md, where relative links and images would break: point them
# at GitHub instead.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|srcset)="(?!https?:|#)([^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/kanaworksai-hue/audio-studio-mcp/main/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(href)="(?!https?:|#|mailto:)([^"]+)"'
replacement = '\1="https://github.com/kanaworksai-hue/audio-studio-mcp/blob/main/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?:|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/kanaworksai-hue/audio-studio-mcp/blob/main/\1)'

[tool.hatch.build.targets.sdist]
# Sources, tests and installers; not the docs site, screenshots or samples.
include = [
    "/src", "/tests", "/scripts", "/README*.md", "/LICENSE", "/install.sh", "/install.ps1",
    "/.python-version", "/uv.lock", "/server.json",
]

[tool.hatch.build.targets.wheel]
packages = ["src/audio_studio_mcp"]
# Editable installs (uv sync) load the package through an import hook (the
# `editables` dependency) instead of a .pth file holding the checkout's path:
# Python before 3.13 reads .pth files in the locale encoding, so on Windows a
# non-ASCII path (e.g. a Japanese user name) stops the venv's Python from starting.
dev-mode-exact = true

[tool.pytest.ini_options]
testpaths = ["tests"]
