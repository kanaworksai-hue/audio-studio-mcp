[project]
name = "audio-studio-mcp"
version = "0.1.0"
description = "Local AI BGM and sound-effect generation (Stable Audio 3) as an MCP server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kanaworksai-hue" }]
requires-python = ">=3.10"
keywords = ["mcp", "stable-audio", "audio-generation", "sound-effects", "bgm", "mlx"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "mcp>=2.3,<3",
    "numpy>=1.24",
    "pydantic>=2",
    "soundfile>=0.12",
]

[project.optional-dependencies]
# Stable Audio 3 on Apple Silicon (the official MLX runtime, cloned by install.sh).
mlx = [
    "mlx>=0.30; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sentencepiece>=0.2",
    "huggingface_hub>=0.20",
    "pillow>=10.0",
]

[project.scripts]
audio-studio-mcp = "audio_studio_mcp.server:main"

[project.urls]
Homepage = "https://github.com/kanaworksai-hue/audio-studio-mcp"
Issues = "https://github.com/kanaworksai-hue/audio-studio-mcp/issues"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_studio_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
