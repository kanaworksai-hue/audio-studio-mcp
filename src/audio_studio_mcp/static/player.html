<!doctype html>
<!-- In-chat player (MCP Apps). Served by chat_player.py as ui://audio-studio/player.html
     with wave.js and the export presets inlined: the sandboxed iframe can load nothing
     else. Talks to the host over postMessage JSON-RPC (ext-apps 2026-01-26). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Studio</title>
<style>
/* The web UI's "framed sheet" tokens (app.css): neutral greys, Kana's hoodie
   yellow as the one hue (current take's action, played waveform, playing row).
   The host draws the frame and the background; the card itself is transparent. */
:root {
  --surface-2: #f3f4f5; --active: #e8e9eb; --rule: #e6e8eb;
  --border-strong: #b9bdc3; --text: #131416; --muted: #5b5e63;
  --ink-btn: #131416; --ink-btn-text: #ffffff;
  --brand: #f5b301; --brand-hover: #ffc21f; --brand-edge: #d39a00; --brand-text: #131416; --focus: #131416;
  --danger: #b42318; --danger-soft: #fff0ee; --ok: #1e7b4f;
  --wave: #8b9097; --wave-played: #9a6c00; --track-bg: #f3f4f5;
  --radius: 10px; --radius-sm: 6px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --surface-2: #2a2a2f; --active: #34343a; --rule: #34343a;
  --border-strong: #55555c; --text: #f2f2f3; --muted: #b8b8bf;
  --ink-btn: #f2f2f3; --ink-btn-text: #131416;
  --brand: #ffc23d; --brand-hover: #ffd068; --brand-edge: #ffc23d; --brand-text: #131416; --focus: #ffc23d;
  --danger: #ff8f84; --danger-soft: #3a1c1c; --ok: #5cc38a;
  --wave: #8a8d94; --wave-played: #ffc23d; --track-bg: #1c1c1f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: max-content; }
body {
  margin: 0; background: transparent; color: var(--text);
  font: 14px/1.45 var(--font-sans, "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans CJK JP", "Microsoft YaHei", sans-serif);
  -webkit-font-smoothing: antialiased;
}
:lang(ja) { word-break: auto-phrase; }
.card { padding: 12px 14px 10px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.head { display: flex; gap: 12px; align-items: flex-start; }
.titles { flex: 1; min-width: 0; }
h1 { font-size: 15px; font-weight: 600; margin: 0; line-height: 1.3; overflow-wrap: anywhere; text-wrap: pretty; }
.sub { margin: 2px 0 0; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; width: 100%;
  color: var(--muted); font-size: 13px; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-wrap: pretty; }
.sub[aria-expanded="true"] { -webkit-line-clamp: unset; }
.facts { margin: 4px 0 0; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.head-tools { display: flex; gap: 6px; flex-shrink: 0; }

.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong); background: transparent; cursor: pointer; white-space: nowrap; font-size: 13px;
}
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .55; cursor: default; }
.btn.toggle[aria-pressed="true"] { background: var(--active); border-color: var(--text); }
.btn svg { width: 14px; height: 14px; flex-shrink: 0; }
/* "Use this": outlined; filled with Kana yellow only on the take you are listening to */
.row.current .keep:not([aria-pressed="true"]) { background: var(--brand); border-color: var(--brand-edge); color: var(--brand-text); font-weight: 600; }
.row.current .keep:not([aria-pressed="true"]):hover { background: var(--brand-hover); }
.keep[aria-pressed="true"] { border-color: var(--text); font-weight: 600; }

.status { margin: 10px 0 0; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.status:empty { display: none; }
.status.error { color: var(--danger); background: var(--danger-soft); padding: 8px 10px; border-radius: var(--radius-sm); }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border-strong); border-top-color: var(--brand);
  animation: spin .9s linear infinite; flex-shrink: 0; display: inline-block; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
.elapsed { font-variant-numeric: tabular-nums; }

/* one column grid shared by every row (subgrid), so the waveforms line up */
.rows { list-style: none; margin: 10px 0 0; padding: 0; display: grid; column-gap: 10px;
  grid-template-columns: 36px fit-content(200px) minmax(0, 1fr) max-content max-content; }
.row {
  grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: center;
  row-gap: 4px; padding: 8px 4px 8px 6px; border-top: 1px solid var(--rule); position: relative;
}
.row:first-child { border-top: 0; }
.row::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: transparent; }
.row.current::before { background: var(--brand); }
.play {
  width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--ink-btn); color: var(--ink-btn-text);
  display: grid; place-items: center; cursor: pointer; padding: 0;
}
.play.playing { background: var(--brand); color: var(--brand-text); }
.play:disabled { background: var(--active); color: var(--muted); cursor: progress; }
.play svg { width: 14px; height: 14px; }
.label { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.label b { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.label small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.label kbd { font: inherit; font-size: 11px; color: var(--muted); border: 1px solid var(--border-strong); border-radius: 4px;
  padding: 0 4px; margin-left: 6px; font-weight: 500; vertical-align: 1px; }
.track { height: 40px; border-radius: var(--radius-sm); background: var(--track-bg); cursor: pointer; position: relative; touch-action: none; }
.track canvas { width: 100%; height: 100%; display: block; }
.track .seam { position: absolute; top: 0; bottom: 0; right: 0; width: 2px; background: var(--brand); opacity: 0; }
.loop-on .track .seam { opacity: .9; }
.row.pending .track { background: repeating-linear-gradient(90deg, var(--track-bg) 0 6px, var(--surface-2) 6px 12px); }
.time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 74px; text-align: right; }
.actions { display: flex; gap: 6px; justify-content: flex-end; }
.note { grid-column: 3 / -1; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; user-select: text; }
.note > * + * { margin-left: 6px; }
.note:empty { display: none; }
.note.ok { color: var(--ok); }
.note.error { color: var(--danger); }
.note code { font: 12px/1.4 var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace); color: var(--text); }

.panel { grid-column: 2 / -1; margin: 2px 0 2px; }
.panel-title { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
.presets { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; }
.preset {
  text-align: left; border: 1px solid var(--border-strong); background: transparent; border-radius: var(--radius-sm);
  padding: 7px 9px; cursor: pointer; display: flex; flex-direction: column; gap: 2px;
}
.preset:hover { background: var(--surface-2); }
.preset.rec { border-color: var(--brand-edge); box-shadow: inset 0 0 0 1px var(--brand-edge); }
.preset b { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.preset small { color: var(--muted); font-size: 12px; line-height: 1.35; text-wrap: pretty; }
.preset .spec { font-variant-numeric: tabular-nums; }
.tag { font-weight: 600; font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--brand); color: var(--brand-text); }

.foot { display: flex; align-items: center; gap: 10px; margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--rule); flex-wrap: wrap; }
.foot:empty { display: none; }
.progress { color: var(--muted); font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.hint { color: var(--muted); font-size: 12px; margin-left: auto; }
.paths { margin: 6px 0 0; padding-left: 18px; font-size: 12px; overflow-wrap: anywhere; user-select: text; }

@media (max-width: 620px) {
  .rows { grid-template-columns: 36px minmax(0, 1fr) max-content; }
  .track { grid-column: 1 / -1; grid-row: 2; }
  .time { grid-column: 3; grid-row: 1; }
  .actions { grid-column: 1 / -1; grid-row: 3; justify-content: flex-start; }
  .note, .panel { grid-column: 1 / -1; }
  .hint { margin-left: 0; flex-basis: 100%; }
}
@media (max-width: 480px) {
  .head { flex-direction: column; gap: 8px; }
  .presets { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<main class="card" id="app">

    <div class="titles">
      <h1 id="title"></h1>
      <button class="sub" id="sub" type="button" aria-expanded="false" hidden></button>
      <p class="facts" id="facts" hidden></p>
    </div>
    <div class="head-tools" id="head-tools" hidden>
      <button class="btn toggle" id="loop" type="button" aria-pressed="false"></button>
      <button class="btn" id="seam" type="button" hidden></button>
    </div>
  </header>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <ol class="rows" id="rows"></ol>
  <footer class="foot" id="foot"></footer>
</main>

    this.result = r;
    this.canAct = !!Host.caps.serverTools;
    $("rows").replaceChildren(); this.rows = [];
    if (Array.isArray(r.candidates)) {
      if (this.toolName() === "edit_audio" && this.args && this.args.input_audio) {  // compare against the input first
        this.addRow(new Row({ path: this.args.input_audio, kind: "original" })).optional = true;
      }
      r.candidates.forEach((c, i) => this.addRow(new Row({ path: c.path, seed: c.seed, index: i + 1 })));
    } else if (r.path) {
      this.addRow(new Row({ path: r.path, kind: "result" }));
      if ((r.steps || []).some((s) => String(s).startsWith("loop"))) this.setLoop(true);
    }
    if (this.toolName() !== "process_audio" && (this.args || {}).audio_type === "instrument") this.setLoop(true);
    $("head-tools").hidden = false;
    this.relabel();
    if (!Host.caps.serverTools) {
      this.status(t("noTools"));
      $("status").after(el("ul", { class: "paths" }, ...this.rows.map((x) => el("li", { text: x.path }))));
      for (const x of this.rows) { x.node.classList.remove("pending"); x.timeEl.textContent = ""; }
      this.resize();
      return;
    }
    this.status("");
    this.loadAll();
  },
  async loadAll() {
    // one file at a time: the first one plays soonest, and the host is not flooded
    for (const r of [...this.rows]) {
      if (r.ready || r.loading) continue;
      r.loading = true;
      await r.load();
      if (r.optional && !r.ready) { r.node.remove(); this.rows = this.rows.filter((x) => x !== r); this.relabel(); }
    }
  },
  metaArrived(row) {
    if (row === this.rows[0] || row === this.candidates[0]) { this.header(); this.footer(); }
    if (!this.args && row.kind === "cand" && row.meta.audio_type === "instrument" && !this.loopTouched) this.setLoop(true);
  },
  setLoop(on) {
    Engine.setLoop(on);
    $("loop").setAttribute("aria-pressed", String(on));
    $("seam").hidden = !on;
    document.body.classList.toggle("loop-on", on);
    this.resize();
  },
  seam() {
    const row = Engine.row || this.rows.find((r) => r.ready);
    if (!row) return;
    if (!Engine.loop) this.setLoop(true);
    Engine.play(row, Math.max(0, (row.seconds || 0) - 3));
  },
  lit() { for (const r of this.rows) r.node.classList.toggle("current", Engine.row === r); },
  tick(all) {
    for (const r of this.rows) r.update();
    if (Engine.row) Engine.row.render();
    if (all) this.ensureRaf();
  },
  ensureRaf() {
    if (this.raf) return;
    const step = () => {
      this.raf = 0;
      if (Engine.row) Engine.row.render();
      if (Engine.playing) this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  },
  redrawAll() { for (const r of this.rows) r.render(); },
  // what the user did here, for the model (each call replaces the previous one)
  remember(line) {
    this.actions.push(line);
    if (!Host.caps.updateModelContext) return;
    const text = ["Audio Studio player — what the user did in the in-chat player:", ...this.actions.map((a) => `- ${a}`)].join("\n");
    Host.request("ui/update-model-context", { content: [{ type: "text", text }] }).catch(() => {});
  },
  async choose(row) {
    if (row.chosen) return;
    const msg = row.seed != null
      ? t("keep.msg", { label: row.label, seed: t("cand.seed", { seed: row.seed }), path: row.path })
      : t("keep.msgNoSeed", { label: row.label, path: row.path });
    this.rows.forEach((r) => { if (r.chosen && r !== row) { r.chosen = false; r.renderActions(); } });
    row.chosen = true; row.renderActions();
    this.remember(`chose ${row.modelName}${row.seed != null ? ` (seed ${row.seed})` : ""}: ${row.path}`);
    if (Host.caps.message) {
      try {
        const r = await Host.request("ui/message", { role: "user", content: [{ type: "text", text: msg }] });
        if (!r || !r.isError) return;
      } catch { /* fall through */ }
    }
    row.setNote(Host.caps.updateModelContext ? t("keep.noted") : t("keep.manual", { text: msg }), "ok");
  },
  recommended() {
    const type = (this.args && this.args.audio_type) || ((this.candidates[0] || {}).meta || {}).audio_type;
    return type === "sfx" ? "game_sfx" : type === "instrument" ? "game_loop" : "video_bgm";
  },
  closeMenu(focusButton = false) {
    if (!this.openMenu) return;
    const { menu, button } = this.openMenu;
    menu.remove(); button.setAttribute("aria-expanded", "false");
    this.openMenu = null;
    if (focusButton) button.focus();
    this.resize();
  },
  // the presets open inline under the row (a floating menu would be clipped by the iframe)
  openExport(row, button) {
    if (row.busy) return;
    const was = this.openMenu && this.openMenu.button === button;
    this.closeMenu();
    if (was) return;
    const rec = this.recommended();
    const order = [rec, ...PRESET_ORDER.filter((p) => p !== rec)];
    const id = `panel-${this.rows.indexOf(row)}`;
    const menu = el("div", { class: "panel", id, role: "group", "aria-label": t("export.title") },
      el("p", { class: "panel-title", text: t("export.title") }),
      el("div", { class: "presets" }, ...order.map((p) => el("button", {
        type: "button", class: `preset${p === rec ? " rec" : ""}`, onclick: () => { this.closeMenu(true); this.export(row, p); } },
        el("b", {}, t(`preset.${p}`), p === rec ? el("span", { class: "tag", text: t("export.rec") }) : null),
        el("small", { text: t(`preset.${p}Desc`) }),
        el("small", { class: "spec", text: t(`preset.${p}Spec`) })))));
    row.note.before(menu);
    button.setAttribute("aria-expanded", "true");
    button.setAttribute("aria-controls", id);
    this.openMenu = { menu, button };
    this.resize();
    menu.querySelector("button").focus();
    menu.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      this.closeMenu(true);
      e.preventDefault(); e.stopPropagation();
    });
  },
  async export(row, preset) {
    if (row.busy) return;
    row.busy = true; row.renderActions();
    if (row.exportBtn) row.exportBtn.focus();
    const stop = progress(row.note, t("exporting"));
    row.note.className = "note"; this.resize();
    try {
      const r = await Host.callTool("process_audio", { input_audio: row.path, ...PRESETS[preset], title: `${stemOf(row.path)}_${preset}` });
      stop();
      row.setNote([el("span", { text: t("exported") }), el("code", { text: r.path })], "ok");
      const x = new Row({ path: r.path, kind: "export", preset, exportOf: row });
      x.node.title = r.path;
      let after = this.rows.indexOf(row);  // keep a version's exports right below it
      while (this.rows[after + 1] && this.rows[after + 1].exportOf === row) after++;
      this.rows.splice(after + 1, 0, x);
      this.rows[after].node.after(x.node);
      this.footer();
      this.remember(`exported ${row.modelName} with the "${preset}" preset (${PRESETS[preset].format}, ${PRESETS[preset].sample_rate} Hz): ${r.path}`);
      x.loading = true;
      await x.load();
      if (preset === "game_loop" && !Engine.playing) this.setLoop(true);
    } catch (e) {
      stop();
      row.setNote(t("export.failed", { msg: e.message }), "error");
    } finally {
      const refocus = document.activeElement === row.exportBtn || document.activeElement === document.body;
      row.busy = false; row.renderActions();
      if (refocus && row.exportBtn) row.exportBtn.focus();
    }
  },
  // repeat the call with the next seeds; generate_audio can also be rebuilt from the sidecar
  moreArgs() {
    const tool = this.toolName();
    const seeds = this.candidates.map((r) => r.seed).filter((s) => typeof s === "number");
    const next = seeds.length ? Math.max(...seeds) + 1 : null;
    const withSeed = (a) => {
      if (next != null && next <= 2 ** 31 - 5) a.seed = next; else delete a.seed;
      return a;
    };
    if (tool === "process_audio") return null;
    if (this.args) return { tool, args: withSeed({ ...this.args, variations: 2 }) };
    if (tool !== "generate_audio") return null;
    const m = (this.candidates[0] || {}).meta || {};
    if (!m.prompt_used) return null;
    const sf = m.sound_fields || {};
    const a = { prompt: m.prompt || "", audio_type: m.audio_type || "music", duration_seconds: m.seconds, variations: 2,
      cfg: m.cfg, steps: m.steps, bpm: m.bpm, negative_prompt: m.negative_prompt, title: m.title,
      sound_source: sf.source, sound_action: sf.action, sound_material: sf.material, sound_space: sf.space };
    for (const k of Object.keys(a)) if (a[k] == null || a[k] === "") delete a[k];
    return { tool, args: withSeed(a) };
  },
  async more() {
    const call = this.moreArgs();
    if (!call || this.moreBusy) return;
    this.moreBusy = true;
    this.footer();
    const stop = progress(this.moreProgress, t("more.working"));
    this.status("");
    try {
      const r = await Host.callTool(call.tool, call.args);
      const base = Math.max(0, ...this.candidates.map((x) => x.index));
      let anchor = this.candidates[this.candidates.length - 1];
      const after = (x) => this.rows[this.rows.indexOf(x) + 1];
      while (after(anchor) && after(anchor).exportOf) anchor = after(anchor);
      const added = (r.candidates || []).map((c, i) => new Row({ path: c.path, seed: c.seed, index: base + i + 1 }));
      let at = this.rows.indexOf(anchor);
      for (const x of added) { this.rows.splice(++at, 0, x); anchor.node.after(x.node); anchor = x; }
      this.remember(`made ${added.length} more versions (same prompt, next seeds): ` + added.map((x) => `${x.modelName} seed ${x.seed}: ${x.path}`).join("; "));
      stop(); this.moreProgress.replaceChildren();
      this.moreBusy = false;
      this.relabel();  // key numbers and the "Result" label change with more versions
      await this.loadAll();
    } catch (e) {
      stop(); this.moreProgress.replaceChildren();
      this.moreBusy = false;
      this.footer();
      this.status(t("more.failed", { msg: e.message }), { error: true });
    }
  },
  key(e) {
    if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.closest && e.target.closest(".panel") && e.key !== "Escape") return;
    const cur = Engine.row || this.rows.find((r) => r.ready) || this.rows[0];
    if (!cur) return;
    if (e.key === " " && !(e.target instanceof HTMLButtonElement)) { Engine.toggle(cur); }
    else if (/^[0-9]$/.test(e.key)) {
      const r = this.rows.find((x) => x.keyNo === e.key) || (e.key === "1" && this.candidates.length === 1 ? this.candidates[0] : null);
      if (!r) return;
      if (Engine.playing) Engine.play(r);  // the A/B switch: same moment, other take
      else Engine.seek(r, Engine.timeOf(cur));
    }
    else if (e.key === "l" || e.key === "L") { this.loopTouched = true; this.setLoop(!Engine.loop); }
    else if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      if (e.target.closest && e.target.closest(".track")) return;
      Engine.seek(cur, Engine.timeOf(cur) + (e.key === "ArrowRight" ? 1 : -1) * (e.shiftKey ? 5 : 1));
    }
    else if (e.key === "Escape") this.closeMenu(true);
    else return;
    e.preventDefault();
  },
  // tell the host our height (it sizes the iframe to the content)
  resize() {
    if (this.sizeRaf) return;
    this.sizeRaf = requestAnimationFrame(() => {
      this.sizeRaf = 0;
      const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
      if (h === this.lastH || !Host.ready) return;
      this.lastH = h;
      Host.notify("ui/notifications/size-changed", { height: h });
    });
  },
};

// ── start ─────────────────────────────────────────────────────────────────
setLang();
if (!document.documentElement.dataset.theme) document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
Host.handlers["ui/notifications/tool-input"] = (p) => UI.onInput(p.arguments);
Host.handlers["ui/notifications/tool-result"] = (p) => UI.onResult(p);
Host.handlers["ui/notifications/tool-cancelled"] = () => UI.status(t("cancelled"));
Host.handlers["ui/notifications/host-context-changed"] = (p) => Host.applyContext(p);
$("loop").addEventListener("click", () => { UI.loopTouched = true; UI.setLoop(!Engine.loop); });
$("seam").addEventListener("click", () => UI.seam());
$("sub").addEventListener("click", (e) => {
  const b = e.currentTarget;
  b.setAttribute("aria-expanded", String(b.getAttribute("aria-expanded") !== "true"));
  UI.resize();
});
document.addEventListener("keydown", (e) => UI.key(e));
new ResizeObserver(() => { UI.resize(); UI.redrawAll(); }).observe(document.body);
$("title").textContent = "Audio Studio";
Host.init().then(() => { if (!UI.args && !UI.result) UI.status(t("loading"), { spin: true }); UI.resize(); })
  .catch((e) => UI.status(String(e.message || e), { error: true }));
</script>
</body>
</html>
